name: Portlib Windows reproduction

on:
  pull_request:

permissions:
  contents: read

jobs:
  # An installed Racket keeps iconv-2.dll in its own lib directory. Hiding
  # that DLL makes rktio search the way a source-built CI tree does, since
  # there raco setup puts iconv-2.dll in the user-scope lib directory.
  iconv-search:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-2022', 'windows-2025']
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: |
          portlib-iconv-probe.rkt
          portlib-iconv-scan.ps1
          racket/src/worksp/msvcprep.bat
    - uses: Bogdanp/setup-racket@v1.15
      with:
        architecture: x64
        distribution: minimal
        variant: CS
        version: current
        snapshot_site: northwestern
    - name: Hide the bundled iconv-2.dll
      shell: pwsh
      run: |
        $root = Split-Path (Get-Command racket).Source
        Write-Host "Racket root: $root"
        racket -e "(displayln (version))"
        Move-Item "$root\lib\iconv-2.dll" "$root\lib\iconv-2.dll.hidden"
        "RKTROOT=$root" >> $env:GITHUB_ENV
    - name: Probe without msvcprep
      shell: cmd
      run: |
        racket portlib-iconv-probe.rkt
        pwsh -NoProfile -File portlib-iconv-scan.ps1 "%RKTROOT%" "%RKTROOT%\lib"
    - name: Probe with msvcprep
      shell: cmd
      run: |
        call racket\src\worksp\msvcprep.bat x86_amd64
        racket portlib-iconv-probe.rkt
        pwsh -NoProfile -File portlib-iconv-scan.ps1 "%RKTROOT%" "%RKTROOT%\lib"

name: Portlib Windows reproduction

on:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-2022', 'windows-2025']
        version: ['9.2', 'current']
    steps:
    - uses: actions/checkout@v7
    - uses: Bogdanp/setup-racket@v1.15
      with:
        architecture: x64
        distribution: full
        variant: CS
        version: ${{ matrix.version }}
        snapshot_site: utah
    - name: Run repeated focused trials
      shell: pwsh
      run: |
        $failedProcesses = 0
        for ($trial = 1; $trial -le 20; $trial++) {
          Write-Host "Process $trial"
          & racket .\portlib-windows-repro.rkt
          if ($LASTEXITCODE -ne 0) { $failedProcesses++ }
        }
        Write-Host "Processes with failures: $failedProcesses/20"
        if ($failedProcesses -gt 0) { exit 1 }
    - name: Run portlib in the test sandbox
      if: matrix.os == 'windows-2022' && matrix.version == 'current'
      shell: pwsh
      timeout-minutes: 8
      run: |
        $ErrorActionPreference = 'Continue'
        $failedRuns = 0
        for ($trial = 1; $trial -le 3; $trial++) {
          $log = Join-Path $env:RUNNER_TEMP "portlib-sandbox-$trial.log"
          & racket -f .\pkgs\racket-test-core\tests\racket\portlib-only.rktl *> $log
          $exitCode = $LASTEXITCODE
          Write-Host "Sandbox run $trial, exit $exitCode"
          Get-Content $log -Tail 15
          if ($exitCode -ne 0) { $failedRuns++ }
        }
        Write-Host "Sandbox runs with failures: $failedRuns/3"
        if ($failedRuns -gt 0) { exit 1 }

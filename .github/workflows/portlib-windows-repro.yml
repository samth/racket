name: Portlib Windows reproduction

on:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-2022', 'windows-2025']
        version: ['9.2', 'current']
    steps:
    - uses: actions/checkout@v7
    - uses: Bogdanp/setup-racket@v1.15
      with:
        architecture: x64
        distribution: full
        variant: CS
        version: ${{ matrix.version }}
        snapshot_site: utah
    - name: Run repeated focused trials
      shell: pwsh
      run: |
        $failedProcesses = 0
        for ($trial = 1; $trial -le 20; $trial++) {
          Write-Host "Process $trial"
          & racket .\portlib-windows-repro.rkt
          if ($LASTEXITCODE -ne 0) { $failedProcesses++ }
        }
        Write-Host "Processes with failures: $failedProcesses/20"
        if ($failedProcesses -gt 0) { exit 1 }
